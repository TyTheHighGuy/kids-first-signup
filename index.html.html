<div id="kf-root">
<div id="kf-app"></div>
</div>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700;800&display=swap');

  #kf-root, #kf-root * { box-sizing: border-box; }
  #kf-root {
    font-family: 'Nunito', -apple-system, sans-serif;
    color: #1F2933;
    background: linear-gradient(180deg, #BFE7FF 0%, #EAF7FF 38%, #F7FBFF 100%);
    min-height: 100vh;
    padding: 28px 16px 60px;
    position: relative;
    overflow-x: hidden;
  }
  #kf-root::before, #kf-root::after {
    content: "";
    position: absolute;
    border-radius: 50%;
    background: rgba(255,255,255,0.55);
    z-index: 0;
  }
  #kf-root::before { width: 220px; height: 220px; top: -80px; left: -80px; }
  #kf-root::after { width: 160px; height: 160px; top: 60px; right: -60px; }

  .kf-wrap { max-width: 480px; margin: 0 auto; position: relative; z-index: 1; }

  .kf-hero {
    text-align: center;
    margin-bottom: 18px;
  }
  .kf-hero img {
    width: 132px; height: 132px; border-radius: 50%;
    border: 5px solid #fff;
    box-shadow: 0 10px 24px rgba(27,143,224,0.25);
    object-fit: cover;
    margin-bottom: 14px;
  }
  .kf-eyebrow {
    display: inline-block;
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.08em;
    color: #1B8FE0;
    background: #fff;
    padding: 5px 14px;
    border-radius: 999px;
    box-shadow: 0 2px 8px rgba(27,143,224,0.15);
    margin-bottom: 10px;
  }
  .kf-title {
    font-family: 'Baloo 2', sans-serif;
    font-weight: 800;
    font-size: 34px;
    line-height: 1.08;
    color: #16A34A;
    margin: 4px 0 6px;
    text-shadow: 0 2px 0 rgba(255,255,255,0.6);
  }
  .kf-title span { color: #F0609A; }
  .kf-sub {
    font-size: 15.5px;
    color: #3A4652;
    font-weight: 600;
    max-width: 360px;
    margin: 0 auto;
    line-height: 1.5;
  }

  .kf-card {
    background: #fff;
    border-radius: 26px;
    padding: 26px 22px 22px;
    box-shadow: 0 16px 40px rgba(27,60,90,0.14);
    margin-top: 22px;
  }

  .kf-step-label {
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: 17px;
    color: #1F2933;
    margin: 0 0 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .kf-step-label .kf-dot {
    width: 24px; height: 24px; border-radius: 50%;
    background: #FFC93C;
    color: #7A4E00;
    font-size: 13px;
    display: inline-flex; align-items: center; justify-content: center;
    font-weight: 800;
    flex: none;
  }
  .kf-section + .kf-section { margin-top: 22px; padding-top: 20px; border-top: 2px dashed #E4ECF2; }

  .kf-field { margin-bottom: 14px; }
  .kf-field label {
    display: block;
    font-size: 13.5px;
    font-weight: 700;
    color: #4A5A68;
    margin-bottom: 6px;
  }
  .kf-field .kf-req { color: #F0609A; }
  .kf-field input[type="text"],
  .kf-field input[type="tel"],
  .kf-field input[type="email"],
  .kf-field input[type="number"],
  .kf-field select,
  .kf-field textarea {
    width: 100%;
    border: 2px solid #DCE7EF;
    border-radius: 14px;
    padding: 12px 14px;
    font-size: 15px;
    font-family: 'Nunito', sans-serif;
    color: #1F2933;
    background: #FAFCFE;
    transition: border-color .15s, box-shadow .15s;
  }
  .kf-field textarea { resize: vertical; min-height: 70px; }
  .kf-field input:focus, .kf-field select:focus, .kf-field textarea:focus {
    outline: none;
    border-color: #1B8FE0;
    box-shadow: 0 0 0 4px rgba(27,143,224,0.14);
    background: #fff;
  }
  .kf-row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  .kf-chip-group { display: flex; flex-wrap: wrap; gap: 8px; }
  .kf-chip {
    border: 2px solid #DCE7EF;
    background: #FAFCFE;
    border-radius: 999px;
    padding: 9px 15px;
    font-size: 14px;
    font-weight: 700;
    color: #3A4652;
    cursor: pointer;
    user-select: none;
    transition: all .15s;
  }
  .kf-chip input { display: none; }
  .kf-chip.kf-checked {
    background: #E9F7EB;
    border-color: #4CAF50;
    color: #1E7A31;
  }
  .kf-chip.kf-radio.kf-checked {
    background: #E9F6FF;
    border-color: #1B8FE0;
    color: #0F5F9C;
  }

  .kf-submit {
    width: 100%;
    margin-top: 24px;
    border: none;
    border-radius: 16px;
    padding: 16px;
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: 18px;
    color: #fff;
    background: linear-gradient(135deg, #F0609A, #F2994A);
    box-shadow: 0 10px 22px rgba(240,96,154,0.35);
    cursor: pointer;
    transition: transform .12s, box-shadow .12s;
  }
  .kf-submit:active { transform: translateY(1px) scale(0.99); }
  .kf-submit:disabled { opacity: 0.6; cursor: not-allowed; }

  .kf-error {
    color: #D0342C;
    font-size: 13px;
    font-weight: 700;
    margin-top: 4px;
    display: none;
  }
  .kf-field.kf-invalid input,
  .kf-field.kf-invalid select { border-color: #D0342C; }
  .kf-field.kf-invalid .kf-error { display: block; }

  .kf-note {
    font-size: 12.5px;
    color: #7A8894;
    text-align: center;
    margin-top: 16px;
    line-height: 1.5;
  }

  /* Success state */
  .kf-success {
    display: none;
    text-align: center;
    padding: 10px 4px 4px;
  }
  .kf-success .kf-check {
    width: 74px; height: 74px; border-radius: 50%;
    background: #E9F7EB;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 16px;
    font-size: 38px;
  }
  .kf-success h2 {
    font-family: 'Baloo 2', sans-serif;
    color: #16A34A;
    font-size: 24px;
    margin: 0 0 8px;
  }
  .kf-success p { color: #3A4652; font-size: 15px; line-height: 1.6; margin: 0 0 4px; }

//Z";

  // PASTE your Google Apps Script Web App URL here after deploying (see setup guide).
  // It looks like: https://script.google.com/macros/s/AKfycb.../exec
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwdnHDKuXbnaB29sxot5nX05d27Rz57qphv5Yj9fvyviP4aHEn3ugw61qzivsIsoY7mvQ/exec";

  const root = document.getElementById('kf-app');

  const DAYS = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
  const PROGRAMS = ["Oxford Phonics World (ages 3\u20136)", "Let's Go (ages 5\u201313)", "Not sure \u2014 please advise"];
  const SOURCES = ["Facebook", "Instagram", "Friend / Family", "Walked by the center", "Other"];

  root.innerHTML = `
    <div class="kf-wrap">
      <div class="kf-hero">
        <img src="${HERO_SRC}" alt="Kids First mascots">
        <div class="kf-eyebrow">FREE DEMO CLASS THIS WEEKEND</div>
        <div class="kf-title">KIDS FIRST<br><span>Sign-Up Form</span></div>
        <div class="kf-sub">Fun, easy, together \u2014 tell us about your child and we'll reach out to book their first class.</div>
      </div>

      <div class="kf-card" id="kf-card">
        <form id="kf-form" novalidate>

          <div class="kf-section">
            <div class="kf-step-label"><span class="kf-dot">1</span> Child's Information</div>
            <div class="kf-field" data-field="childName">
              <label>Child's full name <span class="kf-req">*</span></label>
              <input type="text" name="childName" placeholder="e.g. Nong Ploy">
              <div class="kf-error">Please enter your child's name.</div>
            </div>
            <div class="kf-row2">
              <div class="kf-field" data-field="childAge">
                <label>Age <span class="kf-req">*</span></label>
                <input type="number" name="childAge" min="2" max="15" placeholder="e.g. 6">
                <div class="kf-error">Please enter an age.</div>
              </div>
              <div class="kf-field" data-field="program">
                <label>Interested program</label>
                <select name="program">
                  ${PROGRAMS.map(p => `<option value="${p}">${p}</option>`).join('')}
                </select>
              </div>
            </div>
          </div>

          <div class="kf-section">
            <div class="kf-step-label"><span class="kf-dot">2</span> Parent / Guardian</div>
            <div class="kf-field" data-field="parentName">
              <label>Your name <span class="kf-req">*</span></label>
              <input type="text" name="parentName" placeholder="e.g. Khun Suda">
              <div class="kf-error">Please enter your name.</div>
            </div>
            <div class="kf-row2">
              <div class="kf-field" data-field="phone">
                <label>Phone number <span class="kf-req">*</span></label>
                <input type="tel" name="phone" placeholder="08X-XXX-XXXX">
                <div class="kf-error">Please enter a phone number.</div>
              </div>
              <div class="kf-field" data-field="email">
                <label>Email</label>
                <input type="email" name="email" placeholder="you@email.com">
                <div class="kf-error">Please enter a valid email.</div>
              </div>
            </div>
          </div>

          <div class="kf-section">
            <div class="kf-step-label"><span class="kf-dot">3</span> Class Preferences</div>
            <div class="kf-field">
              <label>Preferred days</label>
              <div class="kf-chip-group" id="kf-days">
                ${DAYS.map(d => `
                  <label class="kf-chip">
                    <input type="checkbox" name="days" value="${d}">${d}
                  </label>`).join('')}
              </div>
            </div>
            <div class="kf-field" style="margin-top:14px;">
              <label>How did you hear about us?</label>
              <div class="kf-chip-group" id="kf-source">
                ${SOURCES.map((s,i) => `
                  <label class="kf-chip kf-radio">
                    <input type="radio" name="source" value="${s}" ${i===0?'checked':''}>${s}
                  </label>`).join('')}
              </div>
            </div>
            <div class="kf-field" style="margin-top:14px;">
              <label>Anything else we should know?</label>
              <textarea name="notes" placeholder="Optional \u2014 allergies, scheduling notes, questions..."></textarea>
            </div>
          </div>

          <button type="submit" class="kf-submit" id="kf-submit-btn">Reserve My Spot \uD83C\uDF1F</button>
          <div class="kf-note">We'll text or call you within 1 business day to confirm your free demo class.<br>By submitting, you agree to be contacted by Kids First about enrollment.</div>
        </form>

        <div class="kf-success" id="kf-success">
          <div class="kf-check">\uD83C\uDF89</div>
          <h2>You're on the list!</h2>
          <p>Thanks, <b id="kf-success-name"></b> \u2014 we've got your info.</p>
          <p>A Kids First teacher will reach out soon to confirm your child's free demo class.</p>
        </div>
      </div>
    </div>
  `;

  // Chip toggle styling
  root.querySelectorAll('.kf-chip input').forEach(inp => {
    inp.addEventListener('change', () => {
      const chip = inp.closest('.kf-chip');
      if (inp.type === 'radio') {
        root.querySelectorAll(`input[name="${inp.name}"]`).forEach(sib => {
          sib.closest('.kf-chip').classList.remove('kf-checked');
        });
      }
      chip.classList.toggle('kf-checked', inp.checked);
    });
  });

  const form = document.getElementById('kf-form');
  const submitBtn = document.getElementById('kf-submit-btn');

  function setError(fieldName, hasError) {
    const el = form.querySelector(`[data-field="${fieldName}"]`);
    if (el) el.classList.toggle('kf-invalid', hasError);
  }

  function validate(data) {
    let ok = true;
    if (!data.childName.trim()) { setError('childName', true); ok = false; } else setError('childName', false);
    if (!data.childAge || data.childAge < 1) { setError('childAge', true); ok = false; } else setError('childAge', false);
    if (!data.parentName.trim()) { setError('parentName', true); ok = false; } else setError('parentName', false);
    if (!data.phone.trim() || data.phone.trim().length < 6) { setError('phone', true); ok = false; } else setError('phone', false);
    if (data.email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(data.email)) { setError('email', true); ok = false; } else setError('email', false);
    return ok;
  }

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    const fd = new FormData(form);
    const days = fd.getAll('days');
    const data = {
      childName: fd.get('childName') || '',
      childAge: fd.get('childAge') || '',
      program: fd.get('program') || '',
      parentName: fd.get('parentName') || '',
      phone: fd.get('phone') || '',
      email: fd.get('email') || '',
      days: days,
      source: fd.get('source') || '',
      notes: fd.get('notes') || '',
      submittedAt: new Date().toISOString(),
    };

    if (!validate(data)) return;

    if (SCRIPT_URL.indexOf("PASTE_YOUR_WEB_APP_URL_HERE") !== -1) {
      alert("This form isn't connected to your Google Sheet yet. See the setup guide to add your Web App URL.");
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Sending...';

    try {
      // Apps Script web apps don't return CORS headers for simple POSTs,
      // so we send with no-cors and treat the request as successful if it doesn't throw.
      await fetch(SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(data),
      });

      document.getElementById('kf-success-name').textContent = data.parentName;
      form.style.display = 'none';
      document.getElementById('kf-success').style.display = 'block';
    } catch (err) {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Reserve My Spot \uD83C\uDF1F';
      alert("Sorry, something went wrong submitting your form. Please try again, or contact us directly.");
      console.error(err);
    }
  });
})();
